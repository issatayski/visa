<!DOCTYPE html>
<html lang="ru" class="h-full bg-slate-100">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>W2KZ CRM Enterprise</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <style>
    html, body {
      max-width: 100vw;
      overflow-x: hidden;
    }
    .kanban-scroll {
      display: flex;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .kanban-col {
      scroll-snap-align: start;
      flex-shrink: 0;
    }
  </style>
</head>
<body class="h-full flex flex-col md:flex-row text-slate-800 antialiased selection:bg-blue-500 selection:text-white">

  <!-- Sidebar Desktop -->
  <aside class="hidden md:flex flex-col w-64 bg-slate-900 text-slate-300 min-h-screen p-4 border-r border-slate-800 flex-shrink-0">
    <div class="flex items-center gap-3 mb-6 px-2">
      <div class="w-9 h-9 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold text-base shadow">W2</div>
      <div>
        <h1 class="font-bold text-white text-sm leading-tight">W2KZ CRM</h1>
        <span class="text-[11px] text-slate-400">Система управления визами</span>
      </div>
    </div>
    
    <!-- Sidebar Navigation Menu -->
    <div class="text-[10px] font-semibold uppercase tracking-wider text-slate-500 px-3 mb-2">Навигация</div>
    <nav class="space-y-1 flex-1" id="desktopNav"></nav>

    <div class="pt-4 border-t border-slate-800 text-[11px] text-slate-500 flex items-center justify-between">
      <span>W2KZ Core v3.5</span>
      <span class="w-2 h-2 rounded-full bg-emerald-500"></span>
    </div>
  </aside>

  <!-- Main Area -->
  <div class="flex-1 flex flex-col min-w-0 h-full overflow-y-auto pb-16 md:pb-0">
    
    <!-- Header -->
    <header class="bg-white border-b border-slate-200 px-4 py-3 flex flex-wrap items-center justify-between gap-3 sticky top-0 z-20 shadow-sm">
      <div class="flex items-center gap-3">
        <label for="roleSelector" class="text-xs font-semibold uppercase tracking-wider text-slate-500">Роль:</label>
        <select id="roleSelector" onchange="switchRole(this.value)" class="bg-slate-100 border border-slate-300 rounded-lg text-xs md:text-sm px-3 py-1.5 font-bold text-slate-800 focus:ring-2 focus:ring-blue-500 outline-none cursor-pointer">
          <option value="director">Руководитель</option>
          <option value="manager" selected>Менеджер по продажам</option>
          <option value="lawyer">Юрист (МИО / МИД)</option>
          <option value="employer">Работодатель (ТОО)</option>
          <option value="foreigner">Соискатель (Иностранец)</option>
          <option value="courier">Курьер</option>
        </select>
      </div>

      <div class="flex items-center gap-2">
        <span id="roleBadge" class="text-xs px-2.5 py-1 rounded-md font-semibold"></span>
        <button id="primaryRoleBtn" onclick="handlePrimaryAction()" class="bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white text-xs md:text-sm font-medium px-3.5 py-1.5 rounded-lg flex items-center gap-2 transition shadow-sm">
          <i class="fa-solid fa-plus text-xs"></i> <span id="primaryRoleBtnText">Действие</span>
        </button>
      </div>
    </header>

    <!-- System Status Bar -->
    <div id="roleBanner" class="bg-slate-800 text-slate-200 px-4 py-2 text-xs flex justify-between items-center gap-2">
      <span id="roleBannerText" class="truncate"></span>
      <span id="roleBannerMetrics" class="font-mono text-[11px] bg-slate-700 px-2 py-0.5 rounded flex-shrink-0"></span>
    </div>

    <!-- Dynamic Workspace -->
    <main id="workspace" class="p-4 md:p-6 flex-1 w-full max-w-full">
      <!-- Dynamic Content Rendered Here -->
    </main>

  </div>

  <!-- Mobile Bottom Nav -->
  <nav id="mobileNav" class="md:hidden fixed bottom-0 left-0 right-0 bg-slate-900 border-t border-slate-800 flex justify-around items-center py-2 px-1 z-30"></nav>

  <!-- Modal: New Case -->
  <div id="modalCase" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200">
      <div class="flex justify-between items-center mb-4">
        <h3 class="font-bold text-slate-900 text-base">Регистрация нового дела</h3>
        <button onclick="closeModal('modalCase')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form onsubmit="submitNewCase(event)" class="space-y-3 text-xs md:text-sm">
        <div>
          <label class="block font-medium text-slate-700 mb-1">ФИО Иностранца</label>
          <input type="text" id="inputName" required placeholder="Например: Ким Чен Ун" class="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:border-blue-500">
        </div>
        <div>
          <label class="block font-medium text-slate-700 mb-1">Компания-работодатель</label>
          <input type="text" id="inputCompany" required placeholder="ТОО ..." class="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:border-blue-500">
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block font-medium text-slate-700 mb-1">Тип визы</label>
            <select id="inputVisa" class="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:border-blue-500">
              <option value="C3">Рабочая (C3)</option>
              <option value="B1">Деловая (B1)</option>
              <option value="C2">Воссоединение (C2)</option>
            </select>
          </div>
          <div>
            <label class="block font-medium text-slate-700 mb-1">Стоимость (₸)</label>
            <input type="number" id="inputPrice" required placeholder="450000" class="w-full border border-slate-300 rounded-lg p-2.5 outline-none focus:border-blue-500">
          </div>
        </div>
        <div class="pt-3 flex gap-2">
          <button type="button" onclick="closeModal('modalCase')" class="w-1/2 bg-slate-100 text-slate-700 font-medium py-2 rounded-lg">Отмена</button>
          <button type="submit" class="w-1/2 bg-blue-600 text-white font-medium py-2 rounded-lg hover:bg-blue-700">Сохранить</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    // State Store
    const state = {
      cases: [
        { id: 'KZ-8041', name: 'Чжан Вэй', company: 'ТОО "Азия СпецСтрой"', visa: 'C3', stage: 'docs', price: 450000, margin: 180000, legalStatus: 'Проверка документов', courierTask: 'Забрать оригинал паспорта' },
        { id: 'KZ-7912', name: 'Джон Смит', company: 'АО "Fintech"', visa: 'B1', stage: 'mio', price: 600000, margin: 250000, legalStatus: 'Подано в Акимат', courierTask: null },
        { id: 'KZ-7703', name: 'Мухаммад Али', company: 'ТОО "КазХим"', visa: 'C3', stage: 'mid', price: 520000, margin: 210000, legalStatus: 'Согласование МВД/МИД', courierTask: 'Передать пакет в МИД' },
        { id: 'KZ-7100', name: 'Сергей Петров', company: 'ТОО "АгроСервис"', visa: 'C2', stage: 'done', price: 380000, margin: 120000, legalStatus: 'Виза одобрена', courierTask: null }
      ],
      currentRole: 'manager',
      currentTab: 'kanban'
    };

    // Full Navigation Structure per Role
    const rolesConfig = {
      director: {
        badge: 'bg-purple-100 text-purple-800',
        badgeText: 'Руководитель',
        banner: 'Полный доступ: финансовые показатели, маржинальность и аналитика.',
        btnText: 'Новое дело',
        tabs: [
          { id: 'analytics', label: 'Дашборд & Финансы', icon: 'fa-chart-pie' },
          { id: 'kanban', label: 'Ход производства', icon: 'fa-layer-group' },
          { id: 'reports', label: 'Отчеты по марже', icon: 'fa-file-invoice-dollar' },
          { id: 'settings', label: 'Настройки доступа', icon: 'fa-sliders' }
        ]
      },
      manager: {
        badge: 'bg-blue-100 text-blue-800',
        badgeText: 'Менеджер',
        banner: 'Управление сделками, сбор первичных документов и работа с клиентами.',
        btnText: 'Создать сделку',
        tabs: [
          { id: 'kanban', label: 'Канбан сделок', icon: 'fa-table-columns' },
          { id: 'clients', label: 'База компаний (ТОО)', icon: 'fa-building' },
          { id: 'tasks', label: 'Мои задачи', icon: 'fa-list-check' },
          { id: 'docs', label: 'Шаблоны документов', icon: 'fa-file-lines' }
        ]
      },
      lawyer: {
        badge: 'bg-amber-100 text-amber-800',
        badgeText: 'Юрист',
        banner: 'Правовая экспертиза, квотирование МИО и согласования МИД/МВД.',
        btnText: 'Добавить дело',
        tabs: [
          { id: 'kanban', label: 'Реестр согласований', icon: 'fa-scale-balanced' },
          { id: 'mio-quotas', label: 'Квоты МИО (Акимат)', icon: 'fa-landmark' },
          { id: 'mid-requests', label: 'Запросы МИД / МВД', icon: 'fa-passport' },
          { id: 'archive', label: 'Архив закрытых дел', icon: 'fa-box-archive' }
        ]
      },
      employer: {
        badge: 'bg-emerald-100 text-emerald-800',
        badgeText: 'Работодатель',
        banner: 'Кабинет ТОО: Мониторинг статуса оформления зарубежных специалистов.',
        btnText: 'Заявка на визу',
        tabs: [
          { id: 'portal', label: 'Мои сотрудники', icon: 'fa-users' },
          { id: 'applications', label: 'Поданные заявки', icon: 'fa-paper-plane' },
          { id: 'invoices', label: 'Счета и оплата', icon: 'fa-receipt' }
        ]
      },
      foreigner: {
        badge: 'bg-indigo-100 text-indigo-800',
        badgeText: 'Соискатель',
        banner: 'Персональный трекер статуса вашей рабочей визы.',
        btnText: 'Загрузить фото',
        tabs: [
          { id: 'foreigner-view', label: 'Статус заявки', icon: 'fa-id-card' },
          { id: 'my-documents', label: 'Мои документы', icon: 'fa-folder-open' },
          { id: 'support', label: 'Инструкции и чат', icon: 'fa-circle-question' }
        ]
      },
      courier: {
        badge: 'bg-rose-100 text-rose-800',
        badgeText: 'Курьер',
        banner: 'Модуль доставки: Маршрутный лист по забору и передаче документов.',
        btnText: 'Обновить список',
        tabs: [
          { id: 'courier-view', label: 'Маршрутный лист', icon: 'fa-motorcycle' },
          { id: 'history', label: 'История доставок', icon: 'fa-clock-rotate-left' }
        ]
      }
    };

    const stagesConfig = [
      { id: 'docs', name: '1. Документы' },
      { id: 'mio', name: '2. МИО (Квота)' },
      { id: 'mid', name: '3. МИД / МВД' },
      { id: 'done', name: '4. Готово' }
    ];

    function switchRole(role) {
      state.currentRole = role;
      const conf = rolesConfig[role];
      state.currentTab = conf.tabs[0].id;

      const badgeEl = document.getElementById('roleBadge');
      badgeEl.className = `text-xs px-2.5 py-1 rounded-md font-semibold ${conf.badge}`;
      badgeEl.innerText = conf.badgeText;
      
      document.getElementById('roleBannerText').innerText = conf.banner;
      document.getElementById('primaryRoleBtnText').innerText = conf.btnText;

      updateMetrics();
      renderNav();
      renderWorkspace();
    }

    function updateMetrics() {
      const totalMargin = state.cases.reduce((sum, c) => sum + c.margin, 0);
      const metricsEl = document.getElementById('roleBannerMetrics');

      if (state.currentRole === 'director') {
        metricsEl.innerText = `Прибыль: ${totalMargin.toLocaleString()} ₸ | Всего дел: ${state.cases.length}`;
      } else if (state.currentRole === 'courier') {
        const tasksCount = state.cases.filter(c => c.courierTask).length;
        metricsEl.innerText = `Заданий: ${tasksCount}`;
      } else {
        metricsEl.innerText = `В работе: ${state.cases.length} дел(а)`;
      }
    }

    function renderNav() {
      const conf = rolesConfig[state.currentRole];
      const dNav = document.getElementById('desktopNav');
      const mNav = document.getElementById('mobileNav');

      dNav.innerHTML = '';
      mNav.innerHTML = '';

      conf.tabs.forEach(tab => {
        const isActive = tab.id === state.currentTab;

        // Desktop Button
        const dBtn = document.createElement('button');
        dBtn.onclick = () => { state.currentTab = tab.id; renderNav(); renderWorkspace(); };
        dBtn.className = `w-full flex items-center gap-3 px-3 py-2 rounded-lg text-xs font-medium text-left transition ${
          isActive ? 'bg-blue-600 text-white font-semibold' : 'text-slate-400 hover:bg-slate-800 hover:text-white'
        }`;
        dBtn.innerHTML = `<i class="fa-solid ${tab.icon} w-4 text-center"></i> <span>${tab.label}</span>`;
        dNav.appendChild(dBtn);

        // Mobile Button
        const mBtn = document.createElement('button');
        mBtn.onclick = () => { state.currentTab = tab.id; renderNav(); renderWorkspace(); };
        mBtn.className = `flex flex-col items-center justify-center flex-1 py-1 ${isActive ? 'text-blue-400 font-bold' : 'text-slate-400'}`;
        mBtn.innerHTML = `<i class="fa-solid ${tab.icon} text-sm mb-0.5"></i><span class="text-[9px] truncate max-w-[65px]">${tab.label}</span>`;
        mNav.appendChild(mBtn);
      });
    }

    function renderWorkspace() {
      const ws = document.getElementById('workspace');

      // Routing Map
      switch (state.currentTab) {
        case 'kanban':
          ws.innerHTML = renderKanban();
          break;
        case 'analytics':
          ws.innerHTML = renderAnalyticsView();
          break;
        case 'reports':
          ws.innerHTML = renderReportsView();
          break;
        case 'clients':
          ws.innerHTML = renderClientsView();
          break;
        case 'tasks':
          ws.innerHTML = renderTasksView();
          break;
        case 'portal':
          ws.innerHTML = renderEmployerPortal();
          break;
        case 'foreigner-view':
          ws.innerHTML = renderForeignerTracker();
          break;
        case 'courier-view':
          ws.innerHTML = renderCourierTasks();
          break;
        default:
          ws.innerHTML = renderPlaceholderView(state.currentTab);
      }
    }

    // View Renderers
    function renderKanban() {
      return `
        <div class="kanban-scroll w-full gap-3 md:gap-4 pb-6">
          ${stagesConfig.map(stage => {
            const items = state.cases.filter(c => c.stage === stage.id);
            return `
              <div class="kanban-col w-[85vw] sm:w-[280px] md:w-1/4 bg-slate-200/70 rounded-xl p-3 flex flex-col max-h-[calc(100vh-170px)]">
                <div class="flex justify-between items-center mb-3 px-1">
                  <span class="font-bold text-xs text-slate-700 uppercase tracking-wider">${stage.name}</span>
                  <span class="bg-slate-300 text-slate-700 text-xs px-2 py-0.5 rounded-full font-bold">${items.length}</span>
                </div>
                <div class="space-y-2.5 overflow-y-auto flex-1 pr-0.5">
                  ${items.map(item => renderCaseCard(item)).join('')}
                </div>
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function renderCaseCard(c) {
      let roleSpecificContent = '';

      if (state.currentRole === 'director') {
        roleSpecificContent = `
          <div class="mt-2 pt-2 border-t border-slate-100 flex justify-between text-[11px]">
            <span class="text-slate-500">Чек: <strong>${c.price.toLocaleString()} ₸</strong></span>
            <span class="text-emerald-600 font-bold">Маржа: ${c.margin.toLocaleString()} ₸</span>
          </div>`;
      } else if (state.currentRole === 'lawyer') {
        roleSpecificContent = `
          <div class="mt-2 pt-2 border-t border-slate-100">
            <p class="text-[11px] text-amber-700 bg-amber-50 p-1.5 rounded mb-2">Статус: <strong>${c.legalStatus}</strong></p>
            <button onclick="advanceLegalStatus('${c.id}')" class="w-full bg-slate-800 text-white text-[11px] py-1 rounded font-medium hover:bg-slate-900">Изменить юр. статус</button>
          </div>`;
      } else if (state.currentRole === 'manager') {
        roleSpecificContent = `
          <div class="mt-2 pt-2 border-t border-slate-100 flex items-center justify-between gap-2">
            <span class="text-[11px] font-bold text-slate-700">${c.price.toLocaleString()} ₸</span>
            ${c.stage !== 'done' ? `
              <button onclick="moveCaseStage('${c.id}')" class="bg-blue-600 hover:bg-blue-700 text-white text-[11px] px-2.5 py-1 rounded font-medium transition">
                Дальше <i class="fa-solid fa-arrow-right text-[9px] ml-1"></i>
              </button>
            ` : '<span class="text-[10px] text-emerald-600 font-bold"><i class="fa-solid fa-check"></i> Завершено</span>'}
          </div>`;
      }

      return `
        <div class="bg-white p-3 rounded-lg shadow-sm border border-slate-200">
          <div class="flex justify-between items-center text-xs mb-1">
            <span class="font-mono text-slate-400 text-[10px]">${c.id}</span>
            <span class="text-blue-600 font-bold bg-blue-50 px-1.5 py-0.5 rounded text-[10px]">Виза ${c.visa}</span>
          </div>
          <h4 class="font-bold text-slate-800 text-sm leading-tight">${c.name}</h4>
          <p class="text-xs text-slate-500">${c.company}</p>
          ${roleSpecificContent}
        </div>
      `;
    }

    function renderAnalyticsView() {
      const totalRev = state.cases.reduce((sum, c) => sum + c.price, 0);
      const totalMargin = state.cases.reduce((sum, c) => sum + c.margin, 0);

      return `
        <div class="space-y-4 max-w-5xl mx-auto">
          <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
              <span class="text-xs text-slate-500 font-medium">Общая выручка</span>
              <h3 class="text-xl font-bold text-slate-900 mt-1">${totalRev.toLocaleString()} ₸</h3>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
              <span class="text-xs text-slate-500 font-medium">Чистая маржа</span>
              <h3 class="text-xl font-bold text-emerald-600 mt-1">${totalMargin.toLocaleString()} ₸</h3>
            </div>
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm">
              <span class="text-xs text-slate-500 font-medium">Конверсия в выдачу</span>
              <h3 class="text-xl font-bold text-blue-600 mt-1">94.2%</h3>
            </div>
          </div>

          <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-3">
            <h4 class="font-bold text-slate-800 text-sm">Сводка по типам виз</h4>
            <div class="space-y-2 text-xs">
              <div>
                <div class="flex justify-between mb-1"><span>Рабочие визы (C3)</span><span class="font-mono font-bold">65%</span></div>
                <div class="w-full bg-slate-100 rounded-full h-2"><div class="bg-blue-600 h-2 rounded-full w-[65%]"></div></div>
              </div>
              <div>
                <div class="flex justify-between mb-1"><span>Деловые визы (B1)</span><span class="font-mono font-bold">25%</span></div>
                <div class="w-full bg-slate-100 rounded-full h-2"><div class="bg-amber-500 h-2 rounded-full w-[25%]"></div></div>
              </div>
            </div>
          </div>
        </div>
      `;
    }

    function renderReportsView() {
      return `
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden max-w-5xl mx-auto">
          <div class="p-4 border-b border-slate-200 font-bold text-sm text-slate-800">Финансовый отчет по сделкам</div>
          <div class="overflow-x-auto">
            <table class="w-full text-left text-xs">
              <thead class="bg-slate-50 text-slate-500 uppercase tracking-wider">
                <tr>
                  <th class="p-3">ID</th>
                  <th class="p-3">Клиент</th>
                  <th class="p-3">Компания</th>
                  <th class="p-3">Стоимость</th>
                  <th class="p-3">Маржа</th>
                </tr>
              </thead>
              <tbody class="divide-y divide-slate-100">
                ${state.cases.map(c => `
                  <tr>
                    <td class="p-3 font-mono text-slate-400">${c.id}</td>
                    <td class="p-3 font-bold text-slate-800">${c.name}</td>
                    <td class="p-3 text-slate-600">${c.company}</td>
                    <td class="p-3">${c.price.toLocaleString()} ₸</td>
                    <td class="p-3 text-emerald-600 font-bold">${c.margin.toLocaleString()} ₸</td>
                  </tr>
                `).join('')}
              </tbody>
            </table>
          </div>
        </div>
      `;
    }

    function renderClientsView() {
      return `
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3 max-w-5xl mx-auto">
          <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-2">
            <span class="text-[10px] bg-slate-100 text-slate-600 font-mono px-2 py-0.5 rounded">БИН 120440019283</span>
            <h4 class="font-bold text-slate-900 text-sm">ТОО "Азия СпецСтрой"</h4>
            <p class="text-xs text-slate-500">Контактное лицо: Марат Ахметов (+7 701 555-01-02)</p>
            <div class="pt-2 border-t border-slate-100 flex justify-between text-xs">
              <span>Активных виз: <strong>4</strong></span>
              <span class="text-blue-600 font-medium cursor-pointer">Карточка ТОО &rarr;</span>
            </div>
          </div>
          <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-2">
            <span class="text-[10px] bg-slate-100 text-slate-600 font-mono px-2 py-0.5 rounded">БИН 180940028190</span>
            <h4 class="font-bold text-slate-900 text-sm">АО "Fintech Solutions"</h4>
            <p class="text-xs text-slate-500">Контактное лицо: Елена Пак (+7 777 300-11-22)</p>
            <div class="pt-2 border-t border-slate-100 flex justify-between text-xs">
              <span>Активных виз: <strong>2</strong></span>
              <span class="text-blue-600 font-medium cursor-pointer">Карточка ТОО &rarr;</span>
            </div>
          </div>
        </div>
      `;
    }

    function renderTasksView() {
      return `
        <div class="max-w-2xl mx-auto space-y-2">
          <div class="bg-white p-3 rounded-lg border border-slate-200 flex items-center justify-between text-xs">
            <div class="flex items-center gap-2">
              <input type="checkbox" class="rounded text-blue-600">
              <span>Запросить нотариальный перевод паспорта (Чжан Вэй)</span>
            </div>
            <span class="text-[10px] bg-rose-50 text-rose-700 px-2 py-0.5 rounded font-bold">Сегодня</span>
          </div>
          <div class="bg-white p-3 rounded-lg border border-slate-200 flex items-center justify-between text-xs">
            <div class="flex items-center gap-2">
              <input type="checkbox" class="rounded text-blue-600">
              <span>Выставить счет за визовый сбор для АО "Fintech"</span>
            </div>
            <span class="text-[10px] bg-slate-100 text-slate-600 px-2 py-0.5 rounded">Завтра</span>
          </div>
        </div>
      `;
    }

    function renderEmployerPortal() {
      return `
        <div class="max-w-3xl mx-auto space-y-4">
          <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex flex-wrap justify-between items-center gap-3">
            <div>
              <h2 class="text-lg font-bold text-slate-900">ТОО "Азия СпецСтрой"</h2>
              <p class="text-xs text-slate-500">БИН: 120440019283 • Лимит квоты: 15 сотрудников</p>
            </div>
            <button onclick="openModal('modalCase')" class="bg-blue-600 text-white text-xs px-3.5 py-2 rounded-lg font-medium hover:bg-blue-700">
              <i class="fa-solid fa-plus mr-1"></i> Подать на специалиста
            </button>
          </div>

          <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
            <div class="p-3 bg-slate-50 border-b border-slate-200 font-bold text-xs text-slate-700">Оформляемые иностранцы</div>
            <div class="divide-y divide-slate-100">
              ${state.cases.map(c => `
                <div class="p-3.5 flex items-center justify-between text-xs">
                  <div>
                    <h4 class="font-bold text-slate-800">${c.name}</h4>
                    <p class="text-slate-500">Категория ${c.visa} • ${c.legalStatus}</p>
                  </div>
                  <span class="px-2.5 py-1 rounded-full font-bold ${c.stage === 'done' ? 'bg-emerald-100 text-emerald-800' : 'bg-blue-100 text-blue-800'}">
                    ${c.stage === 'done' ? 'Выдана' : 'В процессе'}
                  </span>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function renderForeignerTracker() {
      const userCase = state.cases[0];
      return `
        <div class="max-w-md mx-auto bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
          <div class="border-b border-slate-100 pb-3">
            <span class="text-[10px] bg-blue-100 text-blue-800 px-2 py-0.5 rounded font-bold uppercase">Трекинг Визы C3</span>
            <h2 class="text-xl font-bold text-slate-900 mt-2">${userCase.name}</h2>
            <p class="text-xs text-slate-500">Приглашающая сторона: ${userCase.company}</p>
          </div>

          <div class="space-y-2">
            <div class="flex justify-between text-xs font-bold">
              <span>Прогресс оформления</span>
              <span>65%</span>
            </div>
            <div class="w-full bg-slate-100 rounded-full h-2">
              <div class="bg-blue-600 h-2 rounded-full w-[65%]"></div>
            </div>
            <p class="text-xs text-slate-600 pt-1"><i class="fa-solid fa-clock text-blue-500 mr-1"></i> Текущий этап: ${userCase.legalStatus}</p>
          </div>

          <div class="pt-2 border-t border-slate-100">
            <button onclick="alert('Документ отправлен на проверку')" class="w-full bg-slate-900 text-white text-xs font-medium py-2.5 rounded-lg">
              <i class="fa-solid fa-upload mr-1"></i> Загрузить копию паспорта
            </button>
          </div>
        </div>
      `;
    }

    function renderCourierTasks() {
      const activeTasks = state.cases.filter(c => c.courierTask);
      return `
        <div class="max-w-md mx-auto space-y-3">
          <h3 class="font-bold text-slate-800 text-sm">Маршрутный лист курьера</h3>
          ${activeTasks.length === 0 ? '<p class="text-xs text-slate-500">Все задания выполнены.</p>' : ''}
          ${activeTasks.map(c => `
            <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm space-y-2">
              <div class="flex justify-between items-center text-xs">
                <span class="font-mono text-slate-400">${c.id}</span>
                <span class="bg-amber-100 text-amber-800 text-[10px] px-2 py-0.5 rounded font-bold">Срочно</span>
              </div>
              <p class="font-bold text-slate-800 text-sm">${c.courierTask}</p>
              <p class="text-xs text-slate-500">Клиент: ${c.name} (${c.company})</p>
              <button onclick="completeCourierTask('${c.id}')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs py-2 rounded-lg font-medium transition">
                <i class="fa-solid fa-check mr-1"></i> Выполнено
              </button>
            </div>
          `).join('')}
        </div>
      `;
    }

    function renderPlaceholderView(tabId) {
      return `
        <div class="max-w-xl mx-auto bg-white p-8 rounded-2xl border border-slate-200 text-center space-y-3 shadow-sm">
          <div class="w-12 h-12 rounded-full bg-blue-50 text-blue-600 flex items-center justify-center mx-auto text-xl">
            <i class="fa-solid fa-folder-open"></i>
          </div>
          <h3 class="font-bold text-slate-800 text-base">Раздел "${tabId}" загружен</h3>
          <p class="text-xs text-slate-500">Реестр синхронизирован с базой данных W2KZ Enterprise.</p>
        </div>
      `;
    }

    // Actions
    function moveCaseStage(id) {
      const item = state.cases.find(c => c.id === id);
      if (!item) return;
      const stageOrder = ['docs', 'mio', 'mid', 'done'];
      const currentIndex = stageOrder.indexOf(item.stage);
      if (currentIndex < stageOrder.length - 1) {
        item.stage = stageOrder[currentIndex + 1];
        updateMetrics();
        renderWorkspace();
      }
    }

    function advanceLegalStatus(id) {
      const item = state.cases.find(c => c.id === id);
      if (!item) return;
      const statuses = ['Проверка документов', 'Подано в Акимат', 'Согласование МВД/МИД', 'Виза одобрена'];
      const currentIdx = statuses.indexOf(item.legalStatus);
      item.legalStatus = statuses[(currentIdx + 1) % statuses.length];
      renderWorkspace();
    }

    function completeCourierTask(id) {
      const item = state.cases.find(c => c.id === id);
      if (item) {
        item.courierTask = null;
        updateMetrics();
        renderWorkspace();
      }
    }

    function handlePrimaryAction() {
      if (['director', 'manager', 'lawyer', 'employer'].includes(state.currentRole)) {
        openModal('modalCase');
      } else {
        alert('Запрос зафиксирован в системе.');
      }
    }

    function openModal(modalId) {
      document.getElementById(modalId).classList.remove('hidden');
    }

    function closeModal(modalId) {
      document.getElementById(modalId).classList.add('hidden');
    }

    function submitNewCase(e) {
      e.preventDefault();
      const name = document.getElementById('inputName').value;
      const company = document.getElementById('inputCompany').value;
      const visa = document.getElementById('inputVisa').value;
      const price = parseInt(document.getElementById('inputPrice').value) || 300000;

      const newId = 'KZ-' + Math.floor(1000 + Math.random() * 9000);
      state.cases.unshift({
        id: newId,
        name,
        company,
        visa,
        stage: 'docs',
        price,
        margin: Math.round(price * 0.4),
        legalStatus: 'Первичный прием',
        courierTask: 'Забрать документы у клиента'
      });

      closeModal('modalCase');
      e.target.reset();
      updateMetrics();
      renderWorkspace();
    }

    // Init
    document.addEventListener('DOMContentLoaded', () => switchRole('manager'));
  </script>
</body>
</html>
